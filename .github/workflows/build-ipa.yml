
name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Vitrine
        uses: actions/checkout@v5

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ipa

          # Remove accidental newlines and surrounding whitespace
          IPA_URL="$(printf '%s' "$IPA_URL" | \
            tr -d '\r\n' | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          # Validate the URL without printing its ticket
          if [[ ! "$IPA_URL" =~ ^https?:// ]]; then
            echo "::error::Invalid IPA URL. Must begin with https://"
            exit 1
          fi

          echo "Downloading Spotify IPA..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            --output ipa/spotify.ipa \
            -- "$IPA_URL"

          echo "Download completed."
          ls -lh ipa/spotify.ipa

          # Check that the downloaded file is a ZIP-based IPA
          if ! unzip -tq ipa/spotify.ipa > /dev/null; then
            echo "::error::Downloaded file is not a valid IPA ZIP archive."
            exit 1
          fi

          # Check the expected iOS application structure
          if ! unzip -Z1 ipa/spotify.ipa | \
            grep -Eq '^Payload/[^/]+\.app/'; then
            echo "::error::IPA is missing its Payload application."
            exit 1
          fi

          echo "Spotify IPA downloaded and validated."

      - name: Build Vitrine IPA
        run: |
          set -euo pipefail
          make release

      - name: Verify build output
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(out/*.ipa)

          if (( ${#files[@]} == 0 )); then
            echo "::error::No Vitrine IPA was generated."
            exit 1
          fi

          echo "Generated IPA files:"
          ls -lh "${files[@]}"

      - name: Upload IPA to GitHub Artifacts
        if: inputs.upload_method != 'filebin'
        uses: actions/upload-artifact@v5
        with:
          name: vitrine-ipa
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA to filebin.net
        if: inputs.upload_method != 'artifacts'
        shell: bash
        run: |
          set -euo pipefail

          BIN="vitrine-${{ github.run_id }}"

          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"

          for f in out/*.ipa; do
            curl \
              --fail \
              --silent \
              --show-error \
              -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://filebin.net/$BIN/$(basename "$f")"

            echo "- https://filebin.net/$BIN/$(basename "$f")" \
              >> "$GITHUB_STEP_SUMMARY"
          done

          echo "- Download promptly; filebin links are temporary." \
            >> "$GITHUB_STEP_SUMMARY"
